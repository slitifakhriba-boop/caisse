[hidden]{display:none!important}
body{margin:0}
/* Layout: dark command bar on top, then one working surface per view. Sale view = ticket column | catalogue tiles, like a counter terminal. */
:root{
  --bg:#e9edf2; --panel:#ffffff; --panel2:#f4f6f9; --line:#d5dbe3; --fg:#141c26; --muted:#5a6676;
  --accent:#1d5bd0; --accent-soft:#e3ebfb; --on-accent:#ffffff;
  --ok:#157a45; --ok-soft:#e1f3e8; --warn:#a76300; --warn-soft:#fbefd9; --bad:#bf3626; --bad-soft:#fbe4e0;
  --top:#151d27; --top2:#1f2a37; --top-fg:#e5ebf2; --top-muted:#93a1b3;
  --c1:#1d5bd0; --c2:#157a45; --c3:#a76300; --c4:#8a3fb8; --c5:#bf3626; --c6:#0f7f8a; --c7:#5a6676;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1218; --panel:#151c24; --panel2:#1b242e; --line:#2a3542; --fg:#e4eaf1; --muted:#93a0b1;
  --accent:#5a8df2; --accent-soft:#1c2a44; --on-accent:#0b1220;
  --ok:#43bf7c; --ok-soft:#14301f; --warn:#e2a443; --warn-soft:#33270f; --bad:#f06b5b; --bad-soft:#3a1915;
  --top:#080b10; --top2:#131a22; --top-fg:#e4eaf1; --top-muted:#8593a5;
  --c1:#5a8df2; --c2:#43bf7c; --c3:#e2a443; --c4:#b67ee0; --c5:#f06b5b; --c6:#3fb7c2; --c7:#93a0b1;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1218; --panel:#151c24; --panel2:#1b242e; --line:#2a3542; --fg:#e4eaf1; --muted:#93a0b1;
  --accent:#5a8df2; --accent-soft:#1c2a44; --on-accent:#0b1220;
  --ok:#43bf7c; --ok-soft:#14301f; --warn:#e2a443; --warn-soft:#33270f; --bad:#f06b5b; --bad-soft:#3a1915;
  --top:#080b10; --top2:#131a22; --top-fg:#e4eaf1; --top-muted:#8593a5;
  --c1:#5a8df2; --c2:#43bf7c; --c3:#e2a443; --c4:#b67ee0; --c5:#f06b5b; --c6:#3fb7c2; --c7:#93a0b1;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--top)}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100%;min-height:0;padding-bottom:env(safe-area-inset-bottom,0px)}

/* Top bar */
.top{background:var(--top);color:var(--top-fg);display:flex;align-items:center;gap:16px;padding-block:8px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;flex-direction:column;line-height:1.05;flex:none}
.brand b{font-family:var(--display);font-size:20px;letter-spacing:.02em;text-transform:uppercase}
.brand span{font-size:11px;color:var(--top-muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:transparent;border:0;color:var(--top-muted);padding:8px 12px;border-radius:6px;font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap}
.nav button:hover{color:var(--top-fg);background:var(--top2)}
.nav button[aria-current="page"]{color:var(--top-fg);background:var(--top2);box-shadow:inset 0 -2px 0 var(--accent)}
.status{display:flex;align-items:center;gap:10px;flex:none;font-size:12px;color:var(--top-muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
#clock{font-family:var(--mono);color:var(--top-fg)}

main{flex:1;min-height:0;overflow:auto}
.view{padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;max-width:1500px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:28px;text-transform:uppercase}
h2{font-size:20px;text-transform:uppercase;letter-spacing:.03em}
h3{font-size:17px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}

/* Buttons */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
input.f,select.f,textarea.f{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 11px;min-height:40px;width:100%}
textarea.f{min-height:80px;resize:vertical}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;min-width:0}
label.fl > *{text-transform:none;letter-spacing:0;font-weight:400;color:var(--fg);font-size:15px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* POS */
.pos{display:grid;grid-template-columns:minmax(340px,430px) 1fr;gap:12px;height:100%;min-height:0;padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.ticket{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tk-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel2)}
.tk-head .ttl{font-family:var(--display);font-size:18px;font-weight:700;text-transform:uppercase}
.clientbtn{margin-left:auto;border:1px dashed var(--line);background:transparent;border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600;text-align:left;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clientbtn.set{border-style:solid;background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tk-lines{flex:1;overflow:auto;min-height:120px}
.tl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:transparent;border-left:0;border-right:0;border-top:0}
.tl:hover{background:var(--panel2)}
.tl.sel{background:var(--accent-soft)}
.tl .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.tl .tt{font-family:var(--mono);font-weight:600;text-align:right}
.tl .sub{font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.tl .qbtns{display:flex;gap:4px;justify-content:flex-end}
.qb{width:30px;height:28px;border-radius:5px;border:1px solid var(--line);background:var(--panel);font-weight:700;line-height:1}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:18px;text-transform:uppercase;margin-bottom:4px}
.tk-tot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--panel2)}
.tk-tot .l{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.tk-tot .l span:last-child{font-family:var(--mono)}
.tk-tot .big{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.tk-tot .big span:first-child{font-family:var(--display);font-size:20px;font-weight:700;text-transform:uppercase}
.tk-tot .big span:last-child{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--fg)}
.tk-act{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.fk{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 4px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-weight:600;font-size:13.5px}
.fk small{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:400}
.fk:hover{border-color:var(--muted)}
.fk.pay{grid-column:span 4;background:var(--ok);border-color:var(--ok);color:#fff;min-height:60px;flex-direction:row;gap:12px;font-family:var(--display);font-size:24px;text-transform:uppercase;letter-spacing:.04em}
.fk.pay small{color:#ffffffcc;font-size:12px}
.fk.del{color:var(--bad)}
.catalog{display:flex;flex-direction:column;min-height:0;min-width:0;gap:10px}
.searchbar{display:flex;gap:8px}
.searchbar input{font-size:17px;min-height:48px;font-family:var(--mono)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:none}

const S={};COLS.forEach(c=>S[c]={});
let ver=0;const bump=()=>{ver++;schedule()};
let db=null,mode='wait';
const CARTK='spa-pos-cart-v1';
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
/* --- stockage local (IndexedDB) --- */
let idb=null;
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('caisse-spa-pwa',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('docs');d.createObjectStore('outbox');d.createObjectStore('meta')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const idbReq=rq=>new Promise((res,rej)=>{rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)});
function idbAll(store){return new Promise((res,rej)=>{const out=[];const rq=idb.transaction(store).objectStore(store).openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out.push([c.key,c.value]);c.continue()}else res(out)};rq.onerror=()=>rej(rq.error)})}
const metaGet=k=>idbReq(idb.transaction('meta').objectStore('meta').get(k));
const metaSet=(k,v)=>idbReq(idb.transaction('meta','readwrite').objectStore('meta').put(v,k));
let seqN=0;const pend=new Map();let flushT=0;
function persist(col,id){pend.set(col+'/'+id,{col,id,data:S[col][id],seq:Date.now()*1000+(seqN++%1000)});clearTimeout(flushT);flushT=setTimeout(flush,30)}
function flush(){clearTimeout(flushT);if(!idb||!pend.size)return;const tx=idb.transaction(['docs','outbox'],'readwrite');const ds=tx.objectStore('docs'),ob=tx.objectStore('outbox');
  for(const [k,o] of pend){if(o.data===undefined){ds.delete(k);ob.put({col:o.col,id:o.id,deleted:true,seq:o.seq},k)}else{ds.put(o.data,k);ob.put({col:o.col,id:o.id,data:o.data,seq:o.seq},k)}}pend.clear();
  tx.oncomplete=()=>{countOutbox();schedSync(1500)};tx.onerror=()=>toast('Enregistrement impossible sur cet appareil. Vérifiez l\'espace disponible.')}
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{flush();if(!document.hidden)schedSync(300)});
function put(col,id,data){S[col][id]=data;bump();persist(col,id);return Promise.resolve()}
function del(col,id){delete S[col][id];bump();persist(col,id);return Promise.resolve()}

const CONF=window.CAISSE_CONFIG||{};
let sbUrl=(CONF.supabaseUrl||lsGet('spa-sb-url')||'').replace(/\/+$/,''),sbKey=CONF.supabaseKey||lsGet('spa-sb-key')||'';
let session=null;try{session=JSON.parse(lsGet('spa-sb-session')||'null')}catch(e){}
let sync={state:'idle',pending:0,last:0,err:''};let syncing=false,syncT=0;
function setSession(j,email){session={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),email};lsSet('spa-sb-session',JSON.stringify(session))}
async function authCall(grant,body){const r=await fetch(sbUrl+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:sbKey,'Content-Type':'application/json'},body:JSON.stringify(body)});let j={};try{j=await r.json()}catch(e){}return{ok:r.ok,status:r.status,j}}
async function sbLogin(email,password){const r=await authCall('password',{email,password});if(!r.ok)throw new Error(r.j.error_description||r.j.msg||r.j.message||'Connexion refusée');setSession(r.j,email)}
async function sbRefresh(){const r=await authCall('refresh_token',{refresh_token:session.refresh_token});if(!r.ok){if(r.status>=400&&r.status<500){session=null;lsSet('spa-sb-session',null);throw{code:'auth'}}throw{code:'net'}}setSession(r.j,session.email)}
async function api(path,opt={},retry=true){if(!session)throw{code:'auth'};if(session.expires_at*1000<Date.now()+60000)await sbRefresh();
  const r=await fetch(sbUrl+path,{...opt,headers:{apikey:sbKey,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===401&&retry){await sbRefresh();return api(path,opt,false)}if(!r.ok){let m='';try{m=await r.text()}catch(e){}throw{code:'http',status:r.status,msg:m}}return r}
async function countOutbox(){if(!idb)return;sync.pending=await idbReq(idb.transaction('outbox').objectStore('outbox').count());refreshSync()}
function schedSync(ms){clearTimeout(syncT);syncT=setTimeout(runSync,ms)}
async function runSync(){if(syncing||!idb)return;if(!sbUrl||!sbKey||!session){sync.state=!sbUrl||!sbKey?'noconf':'nologin';refreshSync();return}if(!navigator.onLine){sync.state='offline';refreshSync();return}
  syncing=true;sync.state='busy';refreshSync();flush();
  try{
    // 1. envoyer les modifications locales
    const items=await idbAll('outbox');
    for(let i=0;i<items.length;i+=200){const chunk=items.slice(i,i+200);
      await api('/rest/v1/docs?on_conflict=col,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(chunk.map(([,o])=>({col:o.col,id:o.id,data:o.deleted?null:o.data,deleted:!!o.deleted,device:DEVICE||null})))});
      await new Promise((res,rej)=>{const tx=idb.transaction('outbox','readwrite');const st=tx.objectStore('outbox');chunk.forEach(([k,o])=>{const g=st.get(k);g.onsuccess=()=>{if(g.result&&g.result.seq===o.seq)st.delete(k)}});tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
    // 2. recevoir les modifications des autres appareils
    const ob=new Set((await idbAll('outbox')).map(([k])=>k));let since=(await metaGet('lastPull'))||'1970-01-01T00:00:00Z';let first=true,changed=false;
    for(;;){const from=first?new Date(Math.max(0,new Date(since).getTime()-15000)).toISOString():since;first=false;
      const r=await api('/rest/v1/docs?select=col,id,data,deleted,updated_at&updated_at=gt.'+encodeURIComponent(from)+'&order=updated_at.asc&limit=1000');const rows=await r.json();
      if(rows.length){const tx=idb.transaction('docs','readwrite');const ds=tx.objectStore('docs');
        for(const row of rows){const k=row.col+'/'+row.id;if(!S[row.col]||ob.has(k))continue;
          if(row.deleted){if(S[row.col][row.id]!==undefined){delete S[row.col][row.id];ds.delete(k);changed=true}}
          else if(JSON.stringify(S[row.col][row.id])!==JSON.stringify(row.data)){S[row.col][row.id]=row.data;ds.put(row.data,k);changed=true}}
        await new Promise(res=>{tx.oncomplete=res;tx.onerror=res});const last=rows[rows.length-1].updated_at;if(last>since)since=last;await metaSet('lastPull',since)}
      if(rows.length<1000)break}
    if(changed)bump();sync.state='ok';sync.last=Date.now();sync.err='';
  }catch(e){console.error(e);sync.state=e&&e.code==='auth'?'nologin':(e instanceof TypeError||(e&&e.code==='net'))?'offline':'error';sync.err=e&&(e.msg||e.message)||'';if(sync.state==='nologin')setTimeout(()=>loginModal(),300)}
  syncing=false;await countOutbox();refreshSync()}
addEventListener('online',()=>schedSync(500));addEventListener('offline',()=>{sync.state='offline';refreshSync()});
setInterval(()=>{if(!document.hidden)runSync()},20000);
function refreshSync(){const dot=$('#syncDot'),lbl=$('#syncLbl');if(!dot)return;const st=sync.state,n=sync.pending;
  const txt={ok:n?n+' en attente':'Synchronisé',busy:'Synchronisation…',offline:'Hors ligne'+(n?' · '+n+' en attente':''),nologin:'Non connecté'+(n?' · '+n+' en attente':''),noconf:'Non configuré',error:'Erreur de synchro'+(n?' · '+n+' en attente':''),idle:'Démarrage…'}[st]||st;
  dot.className='dot'+(st==='ok'&&!n?' ok':st==='error'||st==='nologin'?' bad':'');lbl.textContent=txt;
  const i=$('#syncInfo');if(i)i.innerHTML=syncInfoHTML()}
function syncInfoHTML(){return`<div class="row"><span class="chip ${sync.state==='ok'&&!sync.pending?'ok':sync.state==='error'||sync.state==='nologin'?'bad':'warn'}">${esc($('#syncLbl').textContent)}</span>${sync.last?`<span class="small muted">Dernière synchro : ${frD(iso(new Date(sync.last)))} ${hm(sync.last)}</span>`:''}</div>${sync.err&&sync.state==='error'?`<div class="small" style="color:var(--bad)">${esc(String(sync.err).slice(0,200))}</div>`:''}<div class="small muted">${session?'Compte : '+esc(session.email):'Aucun compte connecté sur cet appareil.'} · Appareil : <b>${esc(DEVICE||'sans nom')}</b></div>`}

async function doLogin(){const u=$('#lgUrl'),k=$('#lgKey');if(u){sbUrl=u.value.trim().replace(/\/+$/,'');sbKey=k.value.trim();lsSet('spa-sb-url',sbUrl);lsSet('spa-sb-key',sbKey)}

  $('#lgErr').textContent='Connexion…';try{await sbLogin(e,p);closeModal();toast('Connecté. Synchronisation en cours…');await runSync();firstRunCheck()}catch(err){$('#lgErr').textContent=err instanceof TypeError?'Pas de connexion internet ou adresse du projet incorrecte.':'Connexion refusée : '+(err.message||'vérifiez l\'e-mail et le mot de passe.')}}

function firstRunCheck(){const n=Object.keys(S.products).length+Object.keys(S.tickets).length;if(n||lsGet('spa-welcomed'))return;
  openModal(head('Bienvenue','Votre caisse est vide')+`<div class="sh-b"><p style="margin:0">Pour retrouver vos articles, clients, ventes et fiches, restaurez la sauvegarde téléchargée depuis l'ancienne version (Réglages → Télécharger une sauvegarde), ou le fichier <b>sauvegarde-depart.json</b> fourni avec l'application.</p>

/* ---------- données dérivées ---------- */
let D=null,Dver=-1;
function derive(){if(Dver===ver)return D;Dver=ver;const c=cfg();
  const tickets=Object.values(S.tickets).sort((a,b)=>b.ts-a.ts);const valid=tickets.filter(t=>!t.voided);const sales=valid.filter(t=>t.kind!=='acompte');
  const sold={},rew={};for(const t of sales){if(!(t.v>=2))continue;if(t.reward&&t.clientCode)rew[U(t.clientCode)]=(rew[U(t.clientCode)]||0)+1;for(const l of t.lines){const p=S.products[l.code];if(p&&p.stock!=null&&p.stock!==''&&t.ts>(p.stockTs||0))sold[l.code]=(sold[l.code]||0)+l.qty}}
  const closures=Object.values(S.closures).sort((a,b)=>b.to-a.to);const lastClose=closures.length?closures[0].to:0;
  const cl={};const touch=k=>cl[k]||(cl[k]={pts:0,spent:0,visits:0,last:'',used:0});
  for(const t of sales){if(!t.clientCode)continue;const x=touch(U(t.clientCode));x.spent+=t.total;x.visits++;if(t.date>x.last)x.last=t.date}
  for(const d of Object.values(S.devis)){if(d.paid&&!d.ticketId&&d.clientCode){const x=touch(U(d.clientCode));x.spent+=devisNet(d);x.visits++;if(d.date>x.last)x.last=d.date}}
  for(const k in cl){const x=cl[k];x.pts=Math.floor(x.spent*c.ptsPerDT*100)/100;x.used=((S.clients[k]&&S.clients[k].rewardsUsed)||0)+(rew[k]||0);x.rewards=Math.max(0,Math.floor(x.pts/c.threshold)-x.used);x.toNext=c.threshold-(x.pts%c.threshold)}
  const closedT=new Set(),closedE=new Set();let legacyExpTo=0,legacyTkTo=0;closures.forEach(z=>{if(z.ticketIds)z.ticketIds.forEach(i=>closedT.add(i));else legacyTkTo=Math.max(legacyTkTo,z.to||0);if(z.expenseIds)z.expenseIds.forEach(i=>closedE.add(i));else legacyExpTo=Math.max(legacyExpTo,z.to||0)});
  const openAll=tickets.filter(t=>!closedT.has(t.id)&&t.ts>legacyTkTo);if(legacyTkTo)tickets.forEach(t=>{if(t.ts<=legacyTkTo)closedT.add(t.id)});const open=openAll.filter(t=>!t.voided);const openExp=Object.values(S.expenses).filter(e=>!closedE.has(e.id)&&e.ts>legacyExpTo).sort((a,b)=>b.ts-a.ts);
  const prods=Object.values(S.products).map(p=>sold[p.code]?{...p,stock:r3(p.stock-sold[p.code])}:p).sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  D={sold,closedT,openAll,tickets,valid,sales,closures,lastClose,cl,open,openExp,prods,c};return D}
const loyal=code=>derive().cl[U(code)]||{pts:0,spent:0,visits:0,last:'',used:0,rewards:0,toNext:cfg().threshold};
const devisSub=d=>(d.lines||[]).reduce((s,l)=>s+lineTotal(l),0);
const devisNet=d=>r3(devisSub(d)-(+d.discount||0));
const depositsOf=id=>id?Object.values(S.tickets).filter(t=>t.kind==='acompte'&&t.devisId===id&&!t.voided).sort((a,b)=>a.ts-b.ts):[];
const depositSum=id=>r3(depositsOf(id).reduce((s,t)=>s+t.total,0));
const cashIn=t=>t.kind==='acompte'?t.total:r3(t.total-(t.deposit||0));
const lineTotal=l=>r3(l.price*l.qty*(1-(+l.disc||0)/100));

/* ---------- panier (brouillon local à cet appareil) ---------- */
let cart=loadCart();let sel=-1;
function emptyCart(){return{lines:[],clientCode:'',discPct:0,discAmt:0,reward:false,devisId:'',note:''}}
function loadCart(){try{return Object.assign(emptyCart(),JSON.parse(localStorage.getItem(CARTK)||'null')||{})}catch(e){return emptyCart()}}
function saveCart(){try{localStorage.setItem(CARTK,JSON.stringify(cart))}catch(e){}refreshPOS()}
function cartTotals(){const sub=r3(cart.lines.reduce((s,l)=>s+lineTotal(l),0));const disc=r3(sub*(+cart.discPct||0)/100+(+cart.discAmt||0));const total=r3(Math.max(0,sub-disc));const deposit=cart.devisId?depositSum(cart.devisId):0;return{sub,disc,total,deposit,due:r3(total-deposit),items:cart.lines.reduce((s,l)=>s+l.qty,0)}}
function findProduct(q){return S.products[U(q)]||null}
function addToCart(code,qty=1){const p=findProduct(code);if(!p){toast('Code inconnu : '+code);return}
  const i=cart.lines.findIndex(l=>l.code===p.code&&!l.disc&&l.price===p.price&&p.price>0);
  if(i>=0){cart.lines[i].qty=r3(cart.lines[i].qty+qty);sel=i}else{cart.lines.push({code:p.code,name:p.name,price:p.price,qty,disc:0,cost:p.cost??null,cat:p.cat||'',type:p.type||'produit'});sel=cart.lines.length-1}
  saveCart();if(!(p.price>0))editLine(sel,'price')}

let rpP='30';
V.rapports={build(el){el.innerHTML=`<div class="view"><div class="row"><h1>Rapports</h1><span class="spacer"></span><div class="row" id="rpP">${[['7','7 jours'],['30','30 jours'],['month','Ce mois'],['90','90 jours'],['all','Tout']].map(([k,l])=>`<button class="tab" data-act="rpP" data-p="${k}" aria-pressed="${rpP===k}">${l}</button>`).join('')}</div><button class="btn" data-act="csvSales">Exporter les ventes (CSV)</button></div>
  <div class="kpis" id="rpK"></div><div class="panel pad chart"><div class="row"><h2>Chiffre d'affaires par jour</h2><span class="small muted" id="rpRange"></span></div><div id="rpChart"></div></div>
  <div class="panel pad" style="display:flex;flex-direction:column;gap:10px;min-width:0"><div class="row"><h2>Journal par jour</h2><span class="small muted">Mêmes calculs que l'onglet Caisse, jour par jour. Comparez ligne à ligne avec votre cahier.</span></div><div class="tbl-wrap" style="max-height:60vh;overflow:auto"><table><thead><tr><th>Date</th><th class="n">Tickets</th><th class="n">Ventes (CA)</th><th class="n">Acomptes reçus</th><th class="n">Acomptes déduits</th><th class="n">Encaissé</th><th class="n">Espèces</th><th class="n">Carte</th><th class="n">Chèque</th><th class="n">Virement</th><th class="n">Import Excel</th><th class="n">Dépenses</th><th class="n">Espèces − dépenses</th></tr></thead><tbody id="rpDays"></tbody></table></div></div>
  <div class="two"><div class="panel pad" style="min-width:0"><h2 style="margin-bottom:12px">Meilleures ventes</h2><div class="bars" id="rpTop"></div></div><div class="panel pad" style="min-width:0"><h2 style="margin-bottom:12px">Par catégorie</h2><div class="bars" id="rpCat"></div></div></div></div>`},
 refresh(){const k=$('#rpK');if(!k)return;const d=derive();const now=new Date();let from='0000';if(rpP==='month')from=iso(new Date(now.getFullYear(),now.getMonth(),1));else if(rpP!=='all')from=iso(new Date(now.getTime()-(+rpP-1)*864e5));
  document.querySelectorAll('#rpP .tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===rpP));
  const ts=d.sales.filter(t=>t.date>=from);const tot=ts.reduce((s,t)=>s+t.total,0);let svc=0,parts=0,margin=0,mk=0;const top={},cats={},days={};
  ts.forEach(t=>{days[t.date]=(days[t.date]||0)+t.total;const f=t.sub?t.total/t.sub:1;t.lines.forEach(l=>{const v=lineTotal(l)*f;const p=S.products[l.code]||{};const type=l.type||p.type||'produit';const cat=catsOf({type,cat:l.cat??p.cat??''});
    if(cat==='services')svc+=v;else parts+=v;const cost=l.cost??p.cost;if(type!=='service'&&cost!=null){margin+=v-cost*l.qty;mk+=v}
    top[l.code]=top[l.code]||{name:l.name,qty:0,v:0};top[l.code].qty+=l.qty;top[l.code].v+=v;cats[cat]=(cats[cat]||0)+v})});
  const nDays=Object.keys(days).length;
  k.innerHTML=`<div class="kpi hl"><span class="k">Chiffre d'affaires</span><span class="v">${fmt(tot)}</span><span class="s">${ts.length} ticket(s)</span></div><div class="kpi"><span class="k">Panier moyen</span><span class="v">${fmt(ts.length?tot/ts.length:0)}</span><span class="s">par ticket</span></div><div class="kpi"><span class="k">Moyenne / jour ouvert</span><span class="v">${fmt(nDays?tot/nDays:0)}</span><span class="s">${nDays} jour(s) avec ventes</span></div><div class="kpi"><span class="k">Services atelier</span><span class="v">${fmt(svc)}</span><span class="s">${tot?Math.round(svc/tot*100):0} % du CA</span></div><div class="kpi"><span class="k">Marge sur pièces</span><span class="v">${fmt(margin)}</span><span class="s">${mk?Math.round(margin/mk*100)+' % des pièces au prix d\'achat connu':'prix d\'achat inconnus'}</span></div>`;
  const keys=Object.keys(days).sort();let start=rpP==='all'?(keys[0]||today()):from;const arr=[];for(let x=new Date(start+'T12:00:00');iso(x)<=today();x=new Date(x.getTime()+864e5))arr.push([iso(x),days[iso(x)]||0]);
  $('#rpRange').textContent=arr.length?frD(arr[0][0])+' → '+frD(arr[arr.length-1][0]):'';$('#rpChart').innerHTML=barChart(arr);
  const tl=Object.entries(top).sort((a,b)=>b[1].v-a[1].v).slice(0,10);const mx=tl.length?tl[0][1].v:1;
  $('#rpTop').innerHTML=tl.map(([c,v])=>`<div class="hbar"><span class="nm" title="${esc(v.name)}">${esc(v.name)}</span><span class="b"><i style="width:${v.v/mx*100}%"></i></span><span class="mono small">${fmt(v.v)}</span></div>`).join('')||'<div class="empty">Aucune vente sur la période.</div>';
  const cl=Object.entries(cats).sort((a,b)=>b[1]-a[1]);const mc=cl.length?cl[0][1]:1;
  $('#rpCat').innerHTML=cl.map(([c,v])=>`<div class="hbar"><span class="nm">${esc(catName(c))}</span><span class="b"><i style="width:${v/mc*100}%;background:${catColor(c)}"></i></span><span class="mono small">${fmt(v)}</span></div>`).join('')||'<div class="empty">Aucune vente sur la période.</div>';
  const dayT={},dayE={};d.valid.filter(t=>t.date>=from).forEach(t=>(dayT[t.date]=dayT[t.date]||[]).push(t));Object.values(S.expenses).filter(e=>e.date>=from).forEach(e=>(dayE[e.date]=dayE[e.date]||[]).push(e));
  const dkeys=[...new Set([...Object.keys(dayT),...Object.keys(dayE)])].sort().reverse();const dtot={n:0,ca:0,di:0,du:0,cash:0,esp:0,car:0,che:0,vir:0,imp:0,exp:0};
  const rowsH=dkeys.map(k=>{const s=sessionStats(dayT[k]||[],dayE[k]||[]);const r={n:s.count,ca:s.total,di:s.depIn,du:s.depUsed,cash:s.cash,esp:s.by.especes||0,car:s.by.carte||0,che:s.by.cheque||0,vir:s.by.virement||0,imp:s.by.import||0,exp:s.exp};Object.keys(dtot).forEach(x=>dtot[x]+=r[x]);
    return`<tr><td>${frD(k)}</td><td class="n">${r.n}</td><td class="n">${fmt(r.ca)}</td><td class="n">${r.di?fmt(r.di):'—'}</td><td class="n">${r.du?fmt(r.du):'—'}</td><td class="n"><b>${fmt(r.cash)}</b></td><td class="n">${fmt(r.esp)}</td><td class="n">${fmt(r.car)}</td><td class="n">${fmt(r.che)}</td><td class="n">${fmt(r.vir)}</td><td class="n">${r.imp?fmt(r.imp):'—'}</td><td class="n">${r.exp?fmt(r.exp):'—'}</td><td class="n">${fmt(r.esp-r.exp)}</td></tr>`}).join('');
  $('#rpDays').innerHTML=rowsH?rowsH+`<tr style="font-weight:700;background:var(--panel2)"><td>Total</td><td class="n">${dtot.n}</td><td class="n">${fmt(dtot.ca)}</td><td class="n">${fmt(dtot.di)}</td><td class="n">${fmt(dtot.du)}</td><td class="n">${fmt(dtot.cash)}</td><td class="n">${fmt(dtot.esp)}</td><td class="n">${fmt(dtot.car)}</td><td class="n">${fmt(dtot.che)}</td><td class="n">${fmt(dtot.vir)}</td><td class="n">${fmt(dtot.imp)}</td><td class="n">${fmt(dtot.exp)}</td><td class="n">${fmt(dtot.esp-dtot.exp)}</td></tr>`:'<tr><td colspan="13" class="muted">Aucune donnée sur la période.</td></tr>'}};
function barChart(arr){if(!arr.length)return'<div class="empty">Aucune donnée.</div>';const W=Math.max(arr.length*16,(($('#rpChart')||{}).clientWidth||900)),H=240,pl=46,pb=26,pt=10;const mx=Math.max(...arr.map(a=>a[1]),1);const step=niceStep(mx);const top=Math.ceil(mx/step)*step;const bw=(W-pl-8)/arr.length;
  let g='';for(let v=0;v<=top+1e-9;v+=step){const y=pt+(H-pt-pb)*(1-v/top);g+=`<line x1="${pl}" x2="${W-4}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y+3}" text-anchor="end">${Math.round(v)}</text>`}
  const every=Math.ceil(arr.length/12);arr.forEach(([d,v],i)=>{const h=(H-pt-pb)*(v/top);const x=pl+i*bw+bw*0.15;g+=`<rect x="${x}" y="${H-pb-h}" width="${Math.max(1,bw*0.7)}" height="${Math.max(0,h)}" rx="2" fill="${d===today()?'var(--ok)':'var(--accent)'}"><title>${frD(d)} : ${fmt(v)} DT</title></rect>`;if(i%every===0)g+=`<text x="${x+bw*0.35}" y="${H-8}" text-anchor="middle">${d.slice(8,10)}/${d.slice(5,7)}</text>`});
  return`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="width:${W}px;max-width:none" role="img" aria-label="Chiffre d'affaires par jour">${g}</svg></div>`}
function niceStep(mx){const raw=mx/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));return[1,2,2.5,5,10].map(m=>m*p).find(s=>s>=raw)}

let logoDraft=null;
function logoPrevHTML(src){return`${src?`<img src="${src}" alt="Logo">`:'<span class="small muted">Aucun logo</span>'}<label class="btn sm">${src?'Changer le logo':'Ajouter le logo'}<input type="file" id="logoIn" accept="image/*" hidden></label>${src?'<button class="btn sm danger" data-act="logoDel">Retirer</button>':''}<span class="small muted">PNG ou JPG · pensez à cliquer sur « Enregistrer les réglages »</span>`}
function bindLogo(){const i=$('#logoIn');if(i)i.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,480/im.width,240/im.height);const cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);const x=cv.getContext('2d');x.drawImage(im,0,0,cv.width,cv.height);let u=cv.toDataURL('image/png');if(u.length>180000)u=cv.toDataURL('image/jpeg',.85);logoDraft=u;$('#logoPrev').innerHTML=logoPrevHTML(u);bindLogo();toast('Logo prêt : cliquez sur « Enregistrer les réglages »')};im.onerror=()=>toast('Image illisible');im.src=rd.result};rd.readAsDataURL(f)})}
function lettres(n){const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'],T=['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
  const u99=n=>{if(n<20)return U[n];const t=Math.floor(n/10),u=n%10;if(t===7||t===9)return T[t]+(t===7&&u===1?' et ':'-')+U[10+u];if(u===0)return T[t]+(t===8?'s':'');if(u===1&&t!==8)return T[t]+' et un';return T[t]+'-'+U[u]};
  const u999=n=>{const c=Math.floor(n/100),r=n%100;let s='';if(c)s=(c>1?U[c]+' ':'')+'cent'+(c>1&&!r?'s':'');if(r)s+=(s?' ':'')+u99(r);return s};
  if(!n)return'zéro';const m=Math.floor(n/1e6),th=Math.floor(n%1e6/1000),r=n%1000,p=[];
  if(m)p.push(u999(m)+' million'+(m>1?'s':''));if(th)p.push(th===1?'mille':u999(th).replace(/(cent|vingt)s$/,'$1')+' mille');if(r)p.push(u999(r));return p.join(' ')}
function enLettres(x){x=r3(x);const d=Math.floor(x+1e-9),m=Math.round((x-d)*1000);return cap(lettres(d))+' dinar'+(d>1?'s':'')+(m?' et '+lettres(m)+' millime'+(m>1?'s':''):'')}
const invoiceOf=(type,id)=>Object.values(S.invoices||{}).find(v=>v.source&&v.source.type===type&&v.source.id===id&&v.status!=='annulee');
function invTotals(lines,discount,rate,timbre,deposit){const k=1+rate/100;const L=lines.map(l=>{const ttc=lineTotal(l);return{...l,ttc,puHT:r3(l.price*(1-(+l.disc||0)/100)/k),ht:r3(ttc/k)}});
  const ttcBrut=r3(L.reduce((s,l)=>s+l.ttc,0));const disc=r3(+discount||0);const ttc=r3(ttcBrut-disc);const ht=r3(ttc/k);const tva=r3(ttc-ht);const net=r3(ttc+timbre);
  return{lines:L,ttcBrut,discount:disc,discountHT:r3(disc/k),ht,tva,ttc,timbre,net,deposit:r3(deposit||0),reste:r3(net-(deposit||0))}}
function nextInvoiceNum(date){const y=date.slice(0,4);const seq=Object.values(S.invoices||{}).filter(v=>v.year===y).reduce((m,v)=>Math.max(m,v.seq||0),0)+1;return{y,seq,num:'FAC-'+y+'-'+String(seq).padStart(4,'0')}}

   <p class="small muted" style="margin:0">Le numéro de facture est attribué à la création et ne peut plus être modifié. Une facture ne se supprime pas : elle peut seulement être annulée.</p>
  </div><div class="sh-f"><button class="btn" data-act="close">Annuler</button><button class="btn primary" data-act="invCreate">Créer la facture</button></div>`)}
function createInvoice(){const c=cfg();const d=invDraft;if(!d)return;const name=$('#iName').value.trim();if(!name)return toast('Indiquez le nom du client');const date=$('#iDate').value||today();
  const n=nextInvoiceNum(date);const T=invTotals(d.lines,d.discount,+c.tva,+c.timbre,d.deposit);const srcDoc=d.type==='devis'?S.devis[d.id]:S.tickets[d.id];const code=U(srcDoc.clientCode||'');
  const inv={id:uid('I'),num:n.num,year:n.y,seq:n.seq,date,ts:Date.now(),device:typeof DEVICE!=='undefined'?DEVICE:'',status:'valide',

  invDraft=null;showInvoice(inv.id,true)}

   <label class="fl">Remarque<input class="f" id="puNote" value="${esc(v.note||'')}"></label>
   ${x&&(x.lines||[]).length?`<h3>Articles importés</h3><div class="tbl-wrap"><table><thead><tr><th>Code</th><th>Article</th><th class="n">Qté</th><th class="n">Prix achat</th></tr></thead><tbody>${x.lines.map(l=>`<tr><td class="mono">${esc(l.code)}</td><td>${esc(l.name)}${l.isNew?' <span class="chip acc">nouveau</span>':''}</td><td class="n">${String(l.qty).replace('.',',')}</td><td class="n">${fmt(l.cost)}</td></tr>`).join('')}</tbody></table></div>`:''}

  bindSupSuggest('puSup','puSupSug',()=>{})}
function savePurch(id){const sup=$('#puSup').value.trim();if(!sup)return toast('Indiquez le fournisseur');const amt=pnum($('#puAmt').value);if(!(amt>=0))return toast('Indiquez le montant de la facture');
  const ref=$('#puRef').value.trim();const old=id?S.purchases[id]:null;const dupe=!old&&ref&&Object.values(S.purchases||{}).find(x=>supKey(x.supplier)===supKey(sup)&&U(x.ref)===U(ref));if(dupe){fsPer='all';fsSel=supKey(dupe.supplier);closeModal();bump();return toast('Cette facture ('+ref+') est déjà enregistrée le '+frD(dupe.date)+' : elle est affichée dans la liste')}
  const nid=id||uid('A');put('purchases',nid,{...(old||{id:nid,ts:Date.now(),source:'saisie',lines:[],total:0}),supplier:supCanon(sup)||sup,ref,date:$('#puDate').value||today(),amount:r3(amt),note:$('#puNote').value.trim()});const dd=$('#puDate').value||today(),nw=today(),pf=fsPer==='month'?nw.slice(0,7)+'-01':fsPer==='year'?nw.slice(0,4)+'-01-01':'0000';const moved=dd<pf;if(moved)fsPer='all';closeModal();bump();toast('Facture fournisseur enregistrée'+(moved?' (datée du '+frD(dd)+' : affichage passé sur « Tout »)':''))}

function supDelPlan(k){const inv=Object.values(S.purchases||{}).filter(x=>supKey(x.supplier)===k);const own=new Set(Object.values(S.products).filter(p=>p.supplier&&supKey(p.supplier)===k).map(p=>p.code));
  inv.forEach(x=>(x.lines||[]).forEach(l=>{if(l.isNew&&S.products[l.code])own.add(l.code)}));const adj={};inv.forEach(x=>(x.lines||[]).forEach(l=>{if(!l.isNew&&S.products[l.code]&&!own.has(l.code))adj[l.code]=r3((adj[l.code]||0)+(+l.qty||0))}));
  const sold=new Set();derive().sales.forEach(t=>t.lines.forEach(l=>{if(own.has(l.code))sold.add(l.code)}));const name=(supList().find(s=>s.key===k)||{}).name||(inv[0]||{}).supplier||'';return{inv,own:[...own],adj,sold,name}}
function delSupplier(k){const pl=supDelPlan(k);const d=derive();const now=Date.now();
  pl.own.forEach(c=>del('products',c));
  Object.entries(pl.adj).forEach(([c,q])=>{const p=S.products[c];if(!p)return;const cur=(d.prods.find(x=>x.code===c)||p).stock;const base=(cur==null||cur==='')?0:+cur;put('products',c,{...p,stock:r3(base-q),stockTs:now,updated:now})});
  pl.inv.forEach(x=>del('purchases',x.id));fsSel='';toast(`Fournisseur ${pl.name} supprimé : ${pl.inv.length} facture(s), ${pl.own.length} article(s)${Object.keys(pl.adj).length?', '+Object.keys(pl.adj).length+' stock(s) corrigé(s)':''}`)}
function undoImport(id){const pu=S.purchases[id];if(!pu)return;const d=derive();const now=Date.now();let rm=0,adj=0,kept=0;
  for(const l of pu.lines||[]){const p=S.products[l.code];if(!p)continue;const cur=(d.prods.find(x=>x.code===p.code)||p).stock;const base=(cur==null||cur==='')?0:+cur;
    const sold=d.sales.some(t=>t.lines.some(x=>x.code===p.code));
    if(l.isNew&&!sold){del('products',p.code);rm++}
    else{put('products',p.code,{...p,stock:r3(base-l.qty),stockTs:now,updated:now});l.isNew?kept++:adj++}}
  del('purchases',id);closeModal();toast(`Import annulé : ${rm} article(s) supprimé(s), ${adj} stock(s) corrigé(s)${kept?', '+kept+' article(s) déjà vendu(s) conservé(s)':''}`)}

/* ================= COMMANDES (clients + boutique) ================= */
const OST={acommander:{l:'À commander',c:'warn'},commande:{l:'Commandée',c:'acc'},recu:{l:'Reçue',c:'ok'},livre:{l:'Livrée',c:''},annule:{l:'Annulée',c:''}};
let odF='cours',odQ='',od=null;
const ordersAll=()=>Object.values(S.orders||{});
const odDone=o=>o.status==='livre'||o.status==='annule'||(o.kind==='boutique'&&o.status==='recu');

function nextOrderNum(){let mx=0;ordersAll().forEach(o=>{const m=String(o.num||'').match(/^C(\d+)$/);if(m)mx=Math.max(mx,+m[1])});return'C'+String(mx+1).padStart(4,'0')}
V.commandes={build(el){el.innerHTML=`<div class="view"><div class="row"><h1>Commandes</h1><span class="spacer"></span><input class="f" id="odQ" placeholder="Rechercher client, article, fournisseur…" style="max-width:300px" value="${esc(odQ)}"><button class="btn" data-act="odSupply">🖨 Liste d'approvisionnement</button><button class="btn" data-act="odNew" data-k="boutique">+ Commande boutique</button><button class="btn primary" data-act="odNew" data-k="client">+ Commande client</button></div>
  <p class="small muted" style="margin:0">Notez ici les pièces qu'un client commande (avec acompte si besoin) et les pièces à commander pour la boutique. Le jour de l'approvisionnement, imprimez la liste : tout ce qui est « À commander », regroupé par fournisseur.</p>
  <div class="kpis" id="odK"></div>
  <div class="row" id="odTabs">${[['cours','En cours'],['acommander','À commander'],['commande','Commandées'],['recu','Reçues'],['fini','Terminées'],['all','Toutes']].map(([k,l])=>`<button class="tab" data-act="odF" data-f="${k}" aria-pressed="${odF===k}">${l}</button>`).join('')}</div>
  <div class="tbl-wrap"><table><thead><tr><th>N°</th><th>Date</th><th>Pour</th><th>Articles</th><th>Fournisseur</th><th class="n">Montant</th><th class="n">Acompte</th><th>Statut</th></tr></thead><tbody id="odT"></tbody></table></div></div>`;
  const i=$('#odQ');i.addEventListener('input',()=>{odQ=i.value;V.commandes.refresh()})},
 refresh(){const t=$('#odT');if(!t)return;document.querySelectorAll('#odTabs .tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===odF));
  const all=ordersAll();const q=norm(odQ);
  const toOrder=all.filter(o=>o.status==='acommander');const waiting=all.filter(o=>o.status==='commande');const toWarn=all.filter(o=>o.kind==='client'&&o.status==='recu');
  const depOpen=r3(all.filter(o=>!odDone(o)).reduce((s,o)=>s+depositSum(o.id),0));
  $('#odK').innerHTML=`<div class="kpi hl"><span class="k">À commander</span><span class="v">${toOrder.reduce((s,o)=>s+(o.lines||[]).length,0)}</span><span class="s">article(s) dans ${toOrder.length} commande(s)</span></div><div class="kpi"><span class="k">Commandées</span><span class="v">${waiting.length}</span><span class="s">en attente de livraison fournisseur</span></div><div class="kpi"><span class="k">Reçues · client à prévenir</span><span class="v">${toWarn.length}</span></div><div class="kpi"><span class="k">Acomptes en attente</span><span class="v">${fmt(depOpen)}</span><span class="s">déduits à la remise au client</span></div>`;
  const f=odF;const list=all.filter(o=>f==='all'?true:f==='cours'?!odDone(o):f==='fini'?odDone(o):o.status===f)
   .filter(o=>!q||norm([o.num,o.clientName,o.phone,o.note,...(o.lines||[]).map(l=>l.name+' '+(l.supplier||''))].join(' ')).includes(q))
   .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0));
  t.innerHTML=list.map(o=>{const dep=o.status==='livre'?0:depositSum(o.id);const st=OST[o.status]||OST.acommander;const items=(o.lines||[]).map(l=>`${String(l.qty).replace('.',',')} × ${esc(l.name)}`);
   return`<tr class="click" data-act="odEdit" data-id="${o.id}"><td class="mono">${esc(o.num||'')}</td><td>${frD(o.date)}</td><td>${o.kind==='boutique'?'<span class="chip">Boutique</span>':`<b>${esc(o.clientName||'Client')}</b>${o.phone?` <span class="small muted mono">${esc(o.phone)}</span>`:''}`}</td><td class="small">${items.slice(0,3).join('<br>')}${items.length>3?`<br><span class="muted">+ ${items.length-3} autre(s)</span>`:''}</td><td class="small">${esc(odSups(o).join(', ')||'—')}</td><td class="n">${o.kind==='client'?fmt(odNet(o)):'—'}</td><td class="n">${dep?fmt(dep):'—'}</td><td><span class="chip ${st.c}">${st.l}</span></td></tr>`}).join('')||'<tr><td colspan="8"><div class="empty"><b>Aucune commande</b>Touchez « + Commande client » quand un client demande une pièce que vous n\'avez pas.</div></td></tr>'}};

function orderModal(id,kind){const src=id?S.orders[id]:null;
  od=src?JSON.parse(JSON.stringify(src)):{id:uid('O'),num:nextOrderNum(),kind:kind||'client',date:today(),ts:Date.now(),clientCode:'',clientName:'',phone:'',lines:[],note:'',status:'acommander'};

  const a=$('#oAdd');a.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();odAddLine()}});a.addEventListener('input',odSuggest);

function odCliSuggest(){const el=$('#oCliSugg');if(!el)return;const qn=norm($('#oName').value).trim(),qp=String($('#oPhone').value).replace(/\D/g,'');
  if((qn.length<2&&qp.length<3)||$('#oCode').value){el.hidden=true;return}
  const list=Object.values(S.clients).filter(c=>(qn.length>=2&&(norm(c.name).includes(qn)||norm(c.code).includes(qn)))||(qp.length>=3&&String(c.phone||'').replace(/\D/g,'').includes(qp))).slice(0,8);
  el.innerHTML=list.map(c=>`<button class="li" type="button" data-act="odCliPick" data-code="${esc(c.code)}"><span class="mono">${esc(c.code)}</span><b>${esc(c.name)}</b><span class="spacer"></span><span class="mono">${esc(c.phone||'')}</span></button>`).join('');el.hidden=!list.length}
function odSuggest(){const el=$('#oSugg');if(!el)return;const raw=$('#oAdd').value.trim();const q=norm(raw);if(!q){el.hidden=true;return}
  const list=derive().prods.filter(p=>norm(p.name).includes(q)||norm(p.code).includes(q)).slice(0,20);
  el.innerHTML=`<button class="li" type="button" data-act="odAddLine"><b>+ Ajouter « ${esc(raw)} »</b><span class="spacer"></span><span class="small muted">article libre</span></button>`+list.map(p=>`<button class="li" type="button" data-act="odPick" data-code="${esc(p.code)}"><span class="mono">${esc(p.code)}</span><b>${esc(p.name)}</b><span class="spacer"></span><span class="mono">${p.price>0?fmt(p.price):''}</span>${p.stock!=null&&p.stock!==''?`<span class="chip ${+p.stock>0?'ok':'warn'}">stock ${String(p.stock).replace('.',',')}</span>`:''}</button>`).join('');el.hidden=false}
function odRead(){if(!od)return;const g=i=>$(i)?$(i).value:'';if(od.kind==='client'){od.clientName=g('#oName').trim();od.phone=g('#oPhone').trim();od.clientCode=U(g('#oCode'))}od.date=g('#oDate')||today();od.status=g('#oStatus')||od.status;od.note=g('#oNote').trim();

  if(!p&&!code){if(!raw)return toast('Tapez le nom de la pièce');p=findProduct(raw)}
  if(p)od.lines.push({code:p.code,name:p.name,qty:1,price:+p.price||0,supplier:p.supplier||''});else od.lines.push({code:'',name:raw,qty:1,price:0,supplier:''});

function odRenderLines(){const el=$('#oLines');if(!el)return;const isC=od.kind==='client';
  el.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>Désignation</th><th class="n">Qté</th>${isC?'<th class="n">Prix de vente</th>':''}<th>Fournisseur</th><th></th></tr></thead><tbody>${od.lines.map((l,i)=>`<tr><td><input class="f" data-ol="name" data-i="${i}" value="${esc(l.name)}" style="min-width:180px">${l.code?`<div class="small muted mono">${esc(l.code)}</div>`:''}</td><td class="n"><input class="f mono" data-ol="qty" data-i="${i}" inputmode="decimal" style="width:64px;text-align:right" value="${String(l.qty).replace('.',',')}"></td>${isC?`<td class="n"><input class="f mono" data-ol="price" data-i="${i}" inputmode="decimal" style="width:100px;text-align:right" value="${l.price?String(l.price).replace('.',','):''}" placeholder="0,000"></td>`:''}<td><input class="f" data-ol="supplier" data-i="${i}" list="oSupList" value="${esc(l.supplier||'')}" placeholder="optionnel" style="min-width:130px"></td><td><button class="qb" data-act="odDelLine" data-i="${i}" aria-label="Retirer">×</button></td></tr>`).join('')||`<tr><td colspan="${isC?5:4}" class="muted">Aucun article. Tapez le nom de la pièce ci-dessus.</td></tr>`}</tbody></table></div>

function odRenderDep(){const el=$('#oDep');if(!el)return;const saved=!!S.orders[od.id];const deps=depositsOf(od.id);const sum=deps.reduce((s,t)=>s+t.total,0);const net=odNet(od);

function odDepositModal(){if(!odSave(true))return;const o=S.orders[od.id];const net=odNet(o);const already=depositSum(o.id);modalCtx={devisId:o.id,order:o.id};if(!METHODS[payMethod])payMethod='especes';
  openModal(head('Acompte · commande '+esc(o.num),esc(o.clientName||'Client'))+`<div class="sh-b">

   <div class="cols2"><div style="display:flex;flex-direction:column;gap:8px"><label class="fl">Montant de l'acompte<input class="f bigin" id="depIn" inputmode="decimal" autofocus data-enter="depOk"></label>

   <p class="small muted" style="margin:0">L'acompte entre dans la caisse du jour (rubrique « Acomptes reçus »). La vente sera comptée quand le client récupère sa pièce, acompte déduit.</p></div>${keypad('depIn')}</div>

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='SUMMARY')return;const f=A[el.dataset.act];if(f){e.preventDefault();e.stopPropagation();f(el,e)}});
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();A[e.target.dataset.enter]();return}
  if(e.key==='Escape'){if(!$('#confirm').hidden){$('#confirm').hidden=true;return}if(!$('#modal').hidden){closeModal();return}}
  if(view!=='vente'||!$('#modal').hidden||!$('#confirm').hidden)return;
  const typing=e.target.matches('input,textarea,select')&&e.target.id!=='posSearch';if(typing)return;
  const map={F2:()=>$('#posSearch').focus(),F4:A.lineQty,F6:A.linePrice,F8:A.discount,F9:A.pickClient,F12:A.pay};
  if(map[e.key]){e.preventDefault();map[e.key]();return}
  if(e.target.id==='posSearch'&&e.target.value)return;
  if(e.key==='Delete'){e.preventDefault();A.lineDel()}
  else if((e.key==='+'||e.key==='-')&&sel>=0&&cart.lines[sel]){e.preventDefault();A[e.key==='+'?'qPlus':'qMinus']({dataset:{i:sel}})}
  else if(e.key==='ArrowDown'&&cart.lines.length){e.preventDefault();sel=Math.min(cart.lines.length-1,sel+1);refreshPOS(false)}
  else if(e.key==='ArrowUp'&&cart.lines.length){e.preventDefault();sel=Math.max(0,sel-1);refreshPOS(false)}
});
