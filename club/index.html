<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Club vélo">
<title>Club Sport Plus Aventure</title>
<style>[hidden]{display:none!important}
:root{--bg:#eef2f7;--panel:#fff;--panel2:#f4f7fb;--line:#dde4ee;--fg:#122033;--muted:#5d6b80;--accent:#1f6fe5;--accent2:#3fb0ff;--accent-soft:#e3eeff;--amber:#f59e0b;--amber-soft:#fff3d6;--ok:#15803d;--ok-soft:#dcf5e5;--bad:#c62828;--bad-soft:#fde4e4;--warn:#b45309;--warn-soft:#fff1d6;--nav:#0f1b2d;--r:10px;
 --font:"Barlow","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1320;--panel:#121d2e;--panel2:#18263a;--line:#26364d;--fg:#e8eef7;--muted:#9aabc2;--accent:#4b93ff;--accent2:#5cc0ff;--accent-soft:#16294a;--amber-soft:#3a2a0c;--ok:#4ade80;--ok-soft:#123222;--bad:#f87171;--bad-soft:#3b1717;--warn:#fbbf24;--warn-soft:#3a2a0c}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:20;background:var(--nav);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;text-decoration:none;color:#fff}
.brand .lg{width:42px;height:42px;display:grid;place-items:center}
.brand .lg svg,.brand .lg img{width:100%;height:100%;object-fit:contain}
.brand b{display:block;font-size:17px;letter-spacing:.02em;line-height:1.1;text-transform:uppercase}
.brand span{display:block;font-size:11px;color:#9fb3cc;letter-spacing:.08em;text-transform:uppercase}
nav.main{display:flex;gap:2px;overflow-x:auto;flex:1 1 auto;scrollbar-width:none}
nav.main::-webkit-scrollbar{display:none}
nav.main a{color:#c9d6e8;text-decoration:none;font-weight:600;font-size:14px;padding:9px 12px;border-radius:8px;white-space:nowrap}
nav.main a:hover{background:rgba(255,255,255,.08);color:#fff}
nav.main a[aria-current="page"]{background:rgba(63,176,255,.18);color:#fff;box-shadow:inset 0 -2px 0 var(--accent2)}
main{max-width:1240px;margin:0 auto;padding:20px 16px 90px}
h1{font-size:26px;margin:0;letter-spacing:.01em}
h2{font-size:19px;margin:0}
h3{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1 1 auto}
.stack{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.grid2>*{min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.muted{color:var(--muted)}.small{font-size:13px}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:2px;text-decoration:none;color:inherit}
.kpi .k{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi .v{font-size:28px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{background:var(--nav);color:#fff;border-color:var(--nav)}.kpi.hl .k,.kpi.hl .s{color:#9fb3cc}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
.f,select.f,textarea.f{width:100%;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.f:focus,select:focus,textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:0}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
label.fl input,label.fl select,label.fl textarea{width:100%;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:15px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--fg)}
label.ck{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
label.ck input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent)}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.fg .w2{grid-column:span 2}
@media (max-width:520px){.fg .w2{grid-column:auto}}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px 14px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
legend{font-weight:700;font-size:14px;padding:0 6px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;color:var(--muted)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:none;color:var(--muted);font-weight:600;font-size:14px;padding:7px 12px;border-radius:8px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--panel);color:var(--fg);border-color:var(--accent)}
.av{width:42px;height:42px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:0 0 auto;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:96px;height:96px;font-size:30px}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;cursor:pointer;text-align:left;min-width:0}
.card:hover{border-color:var(--accent)}
.trace{background:var(--panel2);border-radius:8px;display:block;width:100%}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--warn-soft);border:1px solid transparent;font-size:14px}
.alert.bad{background:var(--bad-soft)}
.alert.info{background:var(--accent-soft)}
.act-date{width:54px;flex:0 0 auto;text-align:center;border-radius:8px;background:var(--accent-soft);color:var(--accent);padding:4px 0;line-height:1.1}
.act-date b{display:block;font-size:20px}
.act-date span{font-size:11px;text-transform:uppercase;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--panel);padding:6px 11px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;width:92px;text-align:center;font-size:12px;font-weight:600}
.badge .md{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,#ffd25a,#ff9f1c);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.badge.off{opacity:.35;filter:grayscale(1)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.li{display:flex;gap:10px;align-items:center;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer;color:inherit;text-decoration:none}
.li:last-child{border-bottom:0}.li:hover{background:var(--panel2)}
/* fenêtre */
#ov{position:fixed;inset:0;background:rgba(8,14,24,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto}
#ov[hidden]{display:none}
.sheet{background:var(--panel);border-radius:14px;width:100%;max-width:640px;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);margin-bottom:4vh}
.sheet.wide{max-width:920px}
.sh-h{display:flex;align-items:flex-start;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.sh-h h2{font-size:20px}
.sh-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.sh-f{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel2);border-radius:0 0 14px 14px}
.x{margin-left:auto;border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#111c2c;color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:calc(100% - 24px)}
#toast[hidden]{display:none}
.hint{font-size:13px;color:var(--muted)}
@media (max-width:700px){header.top{flex-wrap:wrap;padding:8px 10px}nav.main{order:3;flex-basis:100%}main{padding:14px 12px 90px}h1{font-size:22px}.kpi .v{font-size:23px}}
@media print{header.top,#toast{display:none}}
</style>
</head>

const iso=d=>{const x=d instanceof Date?d:new Date(d);return x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())};
const today=()=>iso(new Date());
const dt=s=>new Date(s+'T12:00:00');
const frD=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'';
const MOIS=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MOISL=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const frLong=s=>{if(!s)return'';const d=dt(s);return JOURS[d.getDay()]+' '+d.getDate()+' '+MOISL[d.getMonth()]+' '+d.getFullYear()};
const addDays=(s,n)=>{const d=dt(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{const d=dt(s);const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));d.setDate(d.getDate()-1);return iso(d)};
const daysTo=(a,b)=>Math.round((dt(b)-dt(a))/864e5);
const pnum=v=>{const n=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isNaN(n)?null:n};
const fmt=n=>(+n||0).toLocaleString('fr-FR',{minimumFractionDigits:3,maximumFractionDigits:3});
const km1=n=>(Math.round((+n||0)*10)/10).toLocaleString('fr-FR');
const int=n=>Math.round(+n||0).toLocaleString('fr-FR');
const ageOf=b=>{if(!b)return null;const d=dt(b),t=new Date();let a=t.getFullYear()-d.getFullYear();if(t.getMonth()<d.getMonth()||(t.getMonth()===d.getMonth()&&t.getDate()<d.getDate()))a--;return a};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const getP=(o,k)=>k.split('.').reduce((x,p)=>x==null?undefined:x[p],o);
const setP=(o,k,v)=>{const ps=k.split('.');let x=o;ps.slice(0,-1).forEach(p=>{if(x[p]==null||typeof x[p]!=='object')x[p]={};x=x[p]});x[ps[ps.length-1]]=v};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};

function save(col){dirty.add(col);clearTimeout(saveT);saveT=setTimeout(flush,150)}
function flush(){clearTimeout(saveT);if(!dirty.size)return;const cols=[...dirty];dirty.clear();
  if(idb){try{const tx=idb.transaction('kv','readwrite');const st=tx.objectStore('kv');cols.forEach(c=>st.put(DB[c],c));tx.onerror=()=>toast('Enregistrement impossible : espace insuffisant ?');return}catch(e){console.error(e)}}
  cols.forEach(c=>lsSet('club-'+c,JSON.stringify(DB[c])))}

    try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
  catch(e){console.error(e);idb=null;COLS.forEach(c=>{try{const v=JSON.parse(lsGet('club-'+c)||'null');if(v)DB[c]=v}catch(e){}});toast('Stockage limité sur ce navigateur : faites des sauvegardes régulières')}}

const mName=m=>m?((m.firstName||'')+' '+(m.lastName||'')).trim()||'Sans nom':'Adhérent supprimé';
const mInit=m=>(((m.firstName||'').trim()[0]||'')+((m.lastName||'').trim()[0]||'')).toUpperCase()||'?';
const LOGO_SVG=`<img src="${LOGO_IMG}" alt="Logo" style="border-radius:50%">`;
const avatar=(m,cls='')=>`<span class="av ${cls}">${m&&m.photo?`<img src="${m.photo}" alt="">`:esc(m?mInit(m):'?')}</span>`;
const members=(withArch)=>all('members').filter(m=>withArch||!m.archived).sort((a,b)=>mName(a).localeCompare(mName(b),'fr'));
const subsOf=id=>all('subs').filter(s=>s.memberId===id).sort((a,b)=>(b.start||'').localeCompare(a.start||''));
const actKm=a=>{const c=a.circuitId&&DB.circuits[a.circuitId];return pnum(a.km)??(c?+c.km:0)};
const actDplus=a=>{const c=a.circuitId&&DB.circuits[a.circuitId];return pnum(a.dplus)??(c?+c.dplus:0)};
const partKm=(a,p)=>pnum(p.km)??actKm(a);
const done=a=>a.status!=='annulee'&&a.date<=today();
function presOf(id){return all('acts').filter(a=>done(a)&&(a.parts||[]).some(p=>p.memberId===id&&p.present)).sort((a,b)=>b.date.localeCompare(a.date))}
function usedSessions(s){return presOf(s.memberId).filter(a=>a.date>=s.start&&a.date<=s.end).length}
function subState(s){const t=today();if(s.start>t)return'futur';if(s.end<t)return'fini';if(s.sessions&&usedSessions(s)>=s.sessions)return'fini';return'actif'}
function mState(m){const L=subsOf(m.id);const a=L.find(s=>subState(s)==='actif');if(a)return{k:'actif',s:a,days:daysTo(today(),a.end),left:a.sessions?a.sessions-usedSessions(a):null};
  const f=L.find(s=>subState(s)==='futur');if(f)return{k:'futur',s:f};const e=L.find(s=>subState(s)==='fini');return e?{k:'expire',s:e,since:daysTo(e.end,today())}:{k:'aucun'}}
function stChip(m){const s=mState(m);if(s.k==='actif'){const soon=s.days<=15||(s.left!=null&&s.left<=2);return`<span class="chip ${soon?'warn':'ok'}">${soon?(s.left!=null&&s.left<=2?s.left+' séance(s) restante(s)':'Expire dans '+s.days+' j'):'À jour'}</span>`}
  if(s.k==='futur')return`<span class="chip acc">Commence le ${frD(s.s.start)}</span>`;if(s.k==='expire')return`<span class="chip bad">Expiré</span>`;return`<span class="chip">Sans abonnement</span>`}
const certEnd=m=>m.certDate?addMonths(m.certDate,+cfg().certMonths||12):'';
const certOk=m=>!!m.certDate&&certEnd(m)>=today();
function certChip(m){if(!m.certDate)return'<span class="chip warn">Certificat manquant</span>';return certOk(m)?(daysTo(today(),certEnd(m))<=30?`<span class="chip warn">Certificat jusqu’au ${frD(certEnd(m))}</span>`:''):'<span class="chip bad">Certificat expiré</span>'}
function mStats(id,from,to){const L=presOf(id).filter(a=>(!from||a.date>=from)&&(!to||a.date<=to));let km=0,dp=0;L.forEach(a=>{const p=a.parts.find(x=>x.memberId===id);km+=partKm(a,p)||0;dp+=actDplus(a)||0});return{n:L.length,km,dp,list:L}}
function nextNum(prefix,col,field){const y=today().slice(0,4);const used=new Set(all(col).map(x=>x[field]));let n=all(col).filter(x=>String(x[field]||'').startsWith(prefix+(prefix==='R'?y+'-':''))).length+1,v;do{v=prefix==='R'?'R'+y+'-'+String(n++).padStart(3,'0'):prefix+String(n++).padStart(3,'0')}while(used.has(v));return v}
const BADGES=[
 ['first','🚲','Première sortie','Être présent à sa première activité du club',s=>s.n>=1],

 ['d10000','🏔️','10 000 m D+','10 000 mètres de dénivelé positif cumulés',s=>s.dp>=10000],
 ['prog','📈','En progrès','+3 points ou plus entre deux évaluations',s=>s.progress>=3],

function badgeStats(m){const S=mStats(m.id);const bm={};let forms=0;S.list.forEach(a=>{const k=a.date.slice(0,7);bm[k]=(bm[k]||0)+1;if(a.type==='formation')forms++});

  return{...S,bestMonth:Math.max(0,...Object.values(bm)),forms,progress:ev.length>1?tot(ev[ev.length-1])-tot(ev[0]):0}}

function topBlock(from,to,title){const R=members().map(m=>({m,...mStats(m.id,from,to)})).filter(x=>x.n).sort((a,b)=>b.km-a.km).slice(0,5);if(!R.length)return'';

function monthChart(id){const t=dt(today());const B=[];for(let i=11;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth()-i,1);const k=d.getFullYear()+'-'+pad(d.getMonth()+1);B.push({k,l:MOIS[d.getMonth()],km:0})}
  (id?presOf(id):all('acts').filter(done)).forEach(a=>{const b=B.find(x=>a.date.startsWith(x.k));if(!b)return;if(id){b.km+=partKm(a,a.parts.find(p=>p.memberId===id))||0}else(a.parts||[]).forEach(p=>{if(p.present)b.km+=partKm(a,p)||0})});

function evalForm(memberId,id){const m=DB.members[memberId]||DB.members[(DB.evals[id]||{}).memberId];const src=id&&DB.evals[id];const prev=all('evals').filter(e=>e.memberId===m.id).sort((a,b)=>b.date.localeCompare(a.date))[0];

function traceSvg(c,w,h){const P=(c.pts||[]).filter(p=>isFinite(p[0]));if(P.length<2)return`<svg viewBox="0 0 ${w} ${h}" class="trace" style="aspect-ratio:${w}/${h}"><text x="${w/2}" y="${h/2+4}" text-anchor="middle" font-size="${Math.max(10,h/8)}" fill="var(--muted)">Pas de tracé</text></svg>`;
  const lat0=P[0][0]*Math.PI/180;const X=P.map(p=>p[1]*Math.cos(lat0)),Y=P.map(p=>-p[0]);const x0=Math.min(...X),x1=Math.max(...X),y0=Math.min(...Y),y1=Math.max(...Y);const m=Math.max(6,w*.06);const s=Math.min((w-2*m)/((x1-x0)||1e-9),(h-2*m)/((y1-y0)||1e-9));
  const ox=(w-(x1-x0)*s)/2,oy=(h-(y1-y0)*s)/2;const d=P.map((p,i)=>(i?'L':'M')+((X[i]-x0)*s+ox).toFixed(1)+' '+((Y[i]-y0)*s+oy).toFixed(1)).join(' ');const e=P.length-1;
  return`<svg viewBox="0 0 ${w} ${h}" class="trace" style="aspect-ratio:${w}/${h}" role="img" aria-label="Tracé du circuit"><path d="${d}" fill="none" stroke="#1f6fe5" stroke-width="${Math.max(2,w/110)}" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${((X[0]-x0)*s+ox).toFixed(1)}" cy="${((Y[0]-y0)*s+oy).toFixed(1)}" r="${Math.max(3,w/70)}" fill="#15803d"/><circle cx="${((X[e]-x0)*s+ox).toFixed(1)}" cy="${((Y[e]-y0)*s+oy).toFixed(1)}" r="${Math.max(2.5,w/90)}" fill="#c62828"/></svg>`}
function profileSvg(c){const P=(c.pts||[]).filter(p=>p[2]!=null&&p[3]!=null);if(P.length<2)return'';const W=800,H=170;const D=P[P.length-1][3]||1;const e0=Math.min(...P.map(p=>p[2])),e1=Math.max(...P.map(p=>p[2]));const r=Math.max(20,e1-e0);
  const pts=P.map(p=>[(p[3]/D*(W-40)+30).toFixed(1),(H-20-(p[2]-e0)/r*(H-40)).toFixed(1)]);
  return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Profil d’altitude"><defs><linearGradient id="gPr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fb0ff" stop-opacity=".55"/><stop offset="1" stop-color="#3fb0ff" stop-opacity=".05"/></linearGradient></defs>
   <path d="M${pts[0][0]} ${H-20} L${pts.map(p=>p.join(' ')).join(' L')} L${pts[pts.length-1][0]} ${H-20}Z" fill="url(#gPr)"/><path d="M${pts.map(p=>p.join(' ')).join(' L')}" fill="none" stroke="#1f6fe5" stroke-width="2"/>
   <text x="4" y="24" font-size="12" fill="var(--muted)">${int(e1)} m</text><text x="4" y="${H-24}" font-size="12" fill="var(--muted)">${int(e0)} m</text><text x="${W-10}" y="${H-4}" text-anchor="end" font-size="12" fill="var(--muted)">${km1(D/1000)} km</text></svg>`}
const hav=(a,b)=>{const R=6371000,t=Math.PI/180;const dLa=(b[0]-a[0])*t,dLo=(b[1]-a[1])*t;const x=Math.sin(dLa/2)**2+Math.cos(a[0]*t)*Math.cos(b[0]*t)*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
function parseGPX(txt){const x=new DOMParser().parseFromString(txt,'application/xml');let N=[...x.getElementsByTagName('trkpt')];if(!N.length)N=[...x.getElementsByTagName('rtept')];
  const P=N.map(p=>{const e=p.getElementsByTagName('ele')[0];return[+p.getAttribute('lat'),+p.getAttribute('lon'),e?+e.textContent:NaN]}).filter(p=>isFinite(p[0])&&isFinite(p[1]));if(P.length<2)return null;
  let d=0;const cum=[0];for(let i=1;i<P.length;i++){d+=hav(P[i-1],P[i]);cum.push(d)}
  let up=0,last=null;P.forEach(p=>{if(!isFinite(p[2]))return;if(last==null){last=p[2];return}const dd=p[2]-last;if(dd>=4){up+=dd;last=p[2]}else if(dd<=-4)last=p[2]});
  const step=Math.max(1,Math.ceil(P.length/600));const pts=[];for(let i=0;i<P.length;i+=step)pts.push([+P[i][0].toFixed(5),+P[i][1].toFixed(5),isFinite(P[i][2])?Math.round(P[i][2]):null,Math.round(cum[i])]);
  const L=P.length-1;if((L%step))pts.push([+P[L][0].toFixed(5),+P[L][1].toFixed(5),isFinite(P[L][2])?Math.round(P[L][2]):null,Math.round(cum[L])]);
  const nm=x.getElementsByTagName('name')[0];return{km:Math.round(d/100)/10,dplus:Math.round(up),pts,name:nm?nm.textContent.trim():''}}

    put('acts',{id:uid('V'),type:ty,title:ty==='formation'?pick(['Atelier : réparer une crevaison','Atelier : régler ses freins','Formation sécurité en groupe']):ty==='evenement'?'Petit-déjeuner du club':ty==='entrainement'?'Entraînement fractionné':'Sortie · '+c.name,date:d,time:ty==='evenement'?'09:30':'07:30',circuitId:c?c.id:'',km:ty==='entrainement'&&!c?'25':'',meet:c?c.start:'Magasin Sport Plus Aventure',leader:pick(['Mehdi','Ahmed','Amira']),level:c?['','Tous niveaux','Intermédiaire','Confirmé','Confirmé'][c.diff]:'Tous niveaux',status:'prevue',parts,desc:ty==='evenement'?'Café, jus et gâteaux offerts. Venez avec vos idées de sorties !':''})}
  [[3,'sortie',C[0]],[7,'formation',null],[10,'sortie',C[3]]].forEach(([n,ty,c])=>put('acts',{id:uid('V'),type:ty,title:ty==='formation'?'Atelier mécanique : entretenir sa transmission':'Sortie · '+c.name,date:addDays(t,n),time:ty==='formation'?'17:00':'07:30',circuitId:c?c.id:'',meet:c?c.start:'Atelier Sport Plus Aventure',leader:'Mehdi',level:ty==='formation'?'Tous niveaux':c.diff>2?'Confirmé':'Tous niveaux',max:ty==='formation'?8:'',status:'prevue',parts:M.slice(0,R(3,7)).map(m=>({memberId:m.id,present:false})),desc:ty==='formation'?'Nettoyage, graissage, mesure d’usure de la chaîne. Apportez votre vélo.':'Casque obligatoire, 2 bidons, chambre à air de rechange.'}));
  M.slice(0,6).forEach((m,i)=>{const base=()=>R(1,4);put('evals',{id:uid('E'),memberId:m.id,date:addDays(t,-90),by:'Mehdi',level:m.level,scores:{endurance:base(),technique:base(),mecanique:base(),securite:base(),groupe:base()},comment:'Bonne base, à travailler dans les montées.'});put('evals',{id:uid('E'),memberId:m.id,date:addDays(t,-10),by:'Mehdi',level:m.level,scores:{endurance:R(2,5),technique:R(2,5),mecanique:R(2,5),securite:R(3,5),groupe:R(3,5)},comment:'Belle progression, très bon esprit de groupe.',next:'Tenter la Grande boucle du dimanche'})})}
